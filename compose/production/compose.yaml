name: onerep

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: docker.io/library/postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Set AUTH_DATABASE_PASSWORD}
      GYM_DATABASE_PASSWORD: ${GYM_DATABASE_PASSWORD:?Set GYM_DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/01-create-service-databases.sh:/docker-entrypoint-initdb.d/01-create-service-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *bounded-logging

  redis:
    image: docker.io/library/redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logging

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_REGION: ${AWS_DEFAULT_REGION:?Set AWS_DEFAULT_REGION}
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_ENDPOINT: ""
      RUSTFS_OBS_TRACE_ENDPOINT: ""
      RUSTFS_OBS_METRIC_ENDPOINT: ""
      RUSTFS_OBS_LOG_ENDPOINT: ""
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *bounded-logging

  rustfs-bootstrap:
    image: docker.io/rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    profiles: [bootstrap]
    entrypoint: ["/bin/sh", "/scripts/bootstrap-rustfs.sh"]
    environment:
      RUSTFS_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:?Set S3_BACKUP_ACCESS_KEY}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?Set S3_BACKUP_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?Set AWS_DEFAULT_REGION}
    volumes:
      - ./scripts/bootstrap-rustfs.sh:/scripts/bootstrap-rustfs.sh:ro
      - ./rustfs/gym-api-policy.json:/policies/gym-api-policy.json:ro
      - ./rustfs/gym-backup-policy.json:/policies/gym-backup-policy.json:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    logging: *bounded-logging

  migrate-auth:
    image: ghcr.io/vladgrskkh/onerep-auth:${AUTH_IMAGE_TAG:?Set AUTH_IMAGE_TAG}
    entrypoint: ["/usr/local/bin/goose"]
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://auth_app:${AUTH_DATABASE_PASSWORD}@postgres:5432/auth_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *bounded-logging

  migrate-gym:
    image: ghcr.io/vladgrskkh/onerep-api:${GYM_API_IMAGE_TAG:?Set GYM_API_IMAGE_TAG}
    entrypoint: ["/usr/local/bin/goose"]
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://gym_app:${GYM_DATABASE_PASSWORD}@postgres:5432/gym_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *bounded-logging

  auth:
    image: ghcr.io/vladgrskkh/onerep-auth:${AUTH_IMAGE_TAG:?Set AUTH_IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://auth_app:${AUTH_DATABASE_PASSWORD}@postgres:5432/auth_db?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?Set AUTH_JWT_PRIVATE_KEY}
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *bounded-logging

  gym-api:
    image: ghcr.io/vladgrskkh/onerep-api:${GYM_API_IMAGE_TAG:?Set GYM_API_IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://gym_app:${GYM_DATABASE_PASSWORD}@postgres:5432/gym_db?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      AUTH_BASE_URL: ${AUTH_BASE_URL:?Set AUTH_BASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?Set AWS_DEFAULT_REGION}
    depends_on:
      migrate-gym:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *bounded-logging

  restic:
    image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [backup]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      RESTIC_CACHE_DIR: ${RESTIC_CACHE_DIR:-/root/.cache/restic}
      AWS_ACCESS_KEY_ID: ${RESTIC_S3_ACCESS_KEY:?Set RESTIC_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_S3_SECRET_KEY:?Set RESTIC_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?Set AWS_DEFAULT_REGION}
    volumes:
      - backup-staging:/backup
      - restic-cache:/root/.cache/restic
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: ["snapshots"]
    restart: "no"
    logging: *bounded-logging

  nginx-bootstrap:
    image: docker.io/library/nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    profiles: [bootstrap]
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - acme-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logging

  nginx:
    image: docker.io/library/nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    depends_on:
      auth:
        condition: service_healthy
      gym-api:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *bounded-logging

  certbot:
    image: docker.io/certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: [certificate]
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-lib:/var/lib/letsencrypt
      - acme-webroot:/var/www/certbot
    command: ["renew", "--webroot", "--webroot-path", "/var/www/certbot", "--non-interactive"]
    restart: "no"
    logging: *bounded-logging

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  backup-staging:
  restic-cache:
  letsencrypt:
  certbot-lib:
  acme-webroot:
